<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generátor Sedláčka</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@400;600;700&display=swap');

  :root {
    --black: #0a0a0a;
    --accent: #00dcc8;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--black);
    color: #f0f0f0;
    font-family: 'Source Sans 3', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
    background-image:
      radial-gradient(ellipse at 10% 0%, rgba(0,181,163,0.12) 0%, transparent 55%),
      radial-gradient(ellipse at 90% 100%, rgba(0,181,163,0.08) 0%, transparent 50%);
  }

  header { text-align: center; margin-bottom: 40px; }
  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 7vw, 5rem);
    letter-spacing: 0.04em;
    color: #fff;
    line-height: 1;
  }
  header h1 span { color: var(--accent); }
  header p { margin-top: 10px; color: #888; font-size: 0.95rem; }

  .layout {
    display: flex;
    gap: 40px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 960px;
  }

  /* EDITOR */
  .editor {
    flex: 1 1 300px;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  label {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    display: block;
    margin-bottom: 6px;
  }

  .field { display: flex; flex-direction: column; }

  input[type="text"], textarea {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px;
    color: #fff;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 1rem;
    padding: 10px 14px;
    transition: border-color 0.2s;
    outline: none;
    resize: none;
  }
  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    background: rgba(0,220,200,0.05);
  }
  textarea { min-height: 130px; line-height: 1.5; }

  .char-count { text-align: right; font-size: 0.75rem; color: #666; margin-top: 4px; }
  .char-count.warn { color: #f0a500; }
  .char-count.over { color: #e05050; }

  .btn-row { display: flex; gap: 10px; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    letter-spacing: 0.04em;
    padding: 11px 20px;
    transition: all 0.18s;
  }
  .btn-primary { background: var(--accent); color: #000; flex: 1; }
  .btn-primary:hover { background: #00f0d8; transform: translateY(-1px); }
  .btn-ghost { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #aaa; }
  .btn-ghost:hover { border-color: rgba(255,255,255,0.35); color: #fff; }
  .btn-random {
    background: transparent;
    border: 1px solid rgba(0,220,200,0.3);
    color: var(--accent);
    font-size: 0.82rem;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.18s;
    letter-spacing: 0.03em;
  }
  .btn-random:hover { background: rgba(0,220,200,0.08); border-color: var(--accent); }

  .divider { width: 100%; height: 1px; background: rgba(255,255,255,0.07); margin: 4px 0; }

  /* CARD — square photo, caption inside */
  .preview-wrap {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .card {
    width: 340px;
    background: #111;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 12px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.06);
    font-family: 'Source Sans 3', sans-serif;
  }

  /* Strict square photo container */
  .card-photo-wrap {
    width: 340px;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    background: #000;
  }

  .card-photo {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: center;
    position: absolute;
    inset: 0;
  }

  .card {
    isolation: isolate;
  }

  .card-caption {
    background: #0f0f0f;
    padding: 16px 18px 20px;
  }
  .caption-name { font-weight: 700; font-size: 1.05rem; color: #fff; margin-bottom: 6px; }
  .caption-text { font-size: 1rem; line-height: 1.5; color: #e8e8e8; word-break: break-word; white-space: pre-wrap; }

  .hint { font-size: 0.78rem; color: #555; text-align: center; letter-spacing: 0.04em; }

  footer { margin-top: 52px; color: #3a3a3a; font-size: 0.78rem; letter-spacing: 0.05em; text-align: center; }
</style>
</head>
<body>

<header>
  <h1>Generátor <span>Sedláčka</span></h1>
  <p>Samoobslužný nástroj pro oběti vysoké inteligence</p>
</header>

<div class="layout">

  <div class="editor">
    <div class="field">
      <label>Jméno / název</label>
      <input type="text" id="nameInput" maxlength="40" value="Sedláček" placeholder="Kdo to říká?">
    </div>
    <div class="field">
      <label>Výrok</label>
      <textarea id="quoteInput" maxlength="220" placeholder="Vložte svůj výrok..."></textarea>
      <div class="char-count" id="charCount">0 / 220</div>
    </div>
    <div class="divider"></div>
    <button class="btn-random" id="randomBtn">🎲 Náhodný výrok</button>
    <div class="btn-row">
      <button class="btn-primary" id="copyBtn">💾 Stáhnout PNG</button>
      <button class="btn-ghost" id="clearBtn">Smazat</button>
    </div>
    <div id="statusMsg" style="font-size:0.82rem;color:#888;text-align:center;min-height:1.2em;"></div>
  </div>

  <div class="preview-wrap">
    <div class="card" id="memeCard">
      <div class="card-photo-wrap">
        <img
          class="card-photo"
          id="cardPhoto"
          src="sedlacek.jpg"
          alt="Sedláček"
          crossorigin="anonymous"
        >
      </div>
      <div class="card-caption">
        <div class="caption-name" id="previewName">Sedláček:</div>
        <div class="caption-text" id="previewQuote">Jsem obětí své vysoké inteligence. Pražská kavárna prostě nechápe, že rozumím Václavu Havlovi víc než Václav Havel samotný.</div>
      </div>
    </div>
    <div class="hint">náhled • sdílejte screenshot</div>
  </div>

</div>

<footer>EKONOMIKA JE FEJK</footer>

<script>
const nameInput  = document.getElementById('nameInput');
const quoteInput = document.getElementById('quoteInput');
const charCount  = document.getElementById('charCount');
const previewName  = document.getElementById('previewName');
const previewQuote = document.getElementById('previewQuote');
const statusMsg    = document.getElementById('statusMsg');
const MAX = 220;

const randomQuotes = [
  "Jsem obětí své vysoké inteligence. Pražská kavárna prostě nechápe, že rozumím Václavu Havlovi víc než Václav Havel samotný.",
  "Moje myšlenky jsou tak komplexní, že je chápe jen 0,3 % populace. A ti mi právě píšou na LinkedIn.",
  "Kapitalismus je v podstatě taneční soutěž, kde hraje hudba jen pro ty, kdo mají dobré boty.",
  "Inflace? To jsou jen chyby ve vašem vztahu k penězům. Léčte trauma, ne úrokové sazby.",
  "Řekl jsem to před deseti lety. Nikdo neposlouchal. Teď říkám totéž a říkají tomu 'originální'.",
  "Adam Smith byl dobrý, ale nepočítal se mnou.",
  "Každá recese je vlastně pozvánka k existenciální reflexi. Bohužel ji lidé odmítají a jdou raději do práce.",
  "Nevím, proč jsou lidé chudí. Já nikdy chudý nebyl a funguje mi to výborně.",
  "HDP je číslo bez duše. Já jsem číslo se dvěma dušemi – proto mě akademici nesnáší.",
  "Trh je jen kolektivní halucinace. Já jsem jedna z mála osob, která to ví a zároveň z ní profituje.",
  "Říkám věci, které jsou pravdivé, ale nepříjemné. Proto jsem nepopulární. Nebo populární. Záleží na publiku.",
  "Ekonomie je věda o lidech, kteří se chovají iracionálně. Já jsem výjimka, která potvrzuje pravidlo.",
  "Češi jsou národ, který si zaslouží lepší elity. Naštěstí já tu jsem.",
  "Můj problém není, že mám pravdu. Můj problém je, že ji mám příliš brzy.",
  "Keynes byl génius, ale nezažil mě na přednášce.",
  "Lidé si pletou inteligenci s tím, že se mnou souhlasí. Jsou to blízcí pojmy, ale ne totožné.",
  "Pracuji na knize, která změní způsob, jakým lidstvo přemýšlí o penězích. Píšu ji už čtrnáct let.",
  "Média mi dávají prostor, protože říkám kontroverze. Já jim ale dávám hloubku. Je to nevyvážený vztah.",
  "Kdybych byl politik, byl bych příliš chytrý. To voliči trestají.",
  "Přátelé mi říkají, že jsem nesnesitelný. Kolegové mi říkají totéž. Jsem tedy konzistentní.",
  "Neříkám, že ostatní ekonomové jsou špatní. Říkám, že jsou jiní. A to je zdvořilý způsob, jak říct totéž.",
  "Evropa potřebuje více vizionářů a méně účetních. Já jsem obojí, ale primárně to první.",
  "Bohatství není problém. Problém je, že ho mají ti nesprávní lidé.",
  "Vždy říkám, co si myslím. Lidé to občas nazvou provokací. Já tomu říkám služba veřejnosti.",
  "Globalizace je jako manželství — vstoupíte do ní s optimismem a postupně si uvědomíte, co jste podepsali.",
];

function updatePreview() {
  previewName.textContent = (nameInput.value.trim() || 'Sedláček') + ':';
  previewQuote.textContent = quoteInput.value.trim() || '…';
}

function updateCount() {
  const len = quoteInput.value.length;
  charCount.textContent = `${len} / ${MAX}`;
  charCount.className = 'char-count' + (len > MAX * 0.9 ? ' warn' : '') + (len >= MAX ? ' over' : '');
}

nameInput.addEventListener('input', updatePreview);
quoteInput.addEventListener('input', () => { updatePreview(); updateCount(); });

document.getElementById('clearBtn').addEventListener('click', () => {
  quoteInput.value = '';
  nameInput.value = 'Sedláček';
  updatePreview(); updateCount();
});

let lastRandom = -1;
document.getElementById('randomBtn').addEventListener('click', () => {
  let idx;
  do { idx = Math.floor(Math.random() * randomQuotes.length); } while (idx === lastRandom && randomQuotes.length > 1);
  lastRandom = idx;
  quoteInput.value = randomQuotes[idx];
  updatePreview(); updateCount();
});


document.getElementById('copyBtn').addEventListener('click', async () => {
  const card = document.getElementById('memeCard');

  try {

    const canvas = await html2canvas(card, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#111111'
    });

    const blob = await new Promise(resolve =>
      canvas.toBlob(resolve, 'image/png')
    );

    if (!blob) {
      showStatus('❌ Nepodařilo se vytvořit PNG');
      return;
    }

    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'sedlacek.png';

    document.body.appendChild(a);
    a.click();
    a.remove();

    setTimeout(() => URL.revokeObjectURL(a.href), 1000);

    showStatus('✅ PNG staženo');

  } catch (e) {
    console.error(e);
    showStatus('❌ Chyba při generování PNG');
  }
});

function showStatusfunction showStatus(msg) {
  statusMsg.textContent = msg;
  setTimeout(() => statusMsg.textContent = '', 3500);
}

updatePreview();
updateCount();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

</body>
</html>
